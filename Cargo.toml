[package]
name = "molterra-security"
version = "0.1.0"
edition = "2021"
description = "Adversarial corpus: attacks run against the product's real defenses, with the hardened layer beside them."
publish = false

[workspace]

[dependencies]
molterra-capture = { path = "../capture" }

aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.hex]
opt-level = 3

[lib]
name = "molterra_security"
path = "src/lib.rs"

[[bin]]
name = "redteam"
path = "src/bin/redteam.rs"
